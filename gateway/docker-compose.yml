# Caddy 2.11.7 in front of the Ollama running on this PC.
# 127.0.0.1: the gate is only reachable from this machine during the test.
services:
  caddy:
    image: caddy:2.11.7-alpine@sha256:eb4d35b7452d1ab6171fbdbe8d9275b2301dad6dad92115d91e19fb9b24d510f
    ports:
      - '127.0.0.1:8088:8080'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./users.caddy:/etc/caddy/users.caddy:ro
    extra_hosts:
      - 'host.docker.internal:host-gateway'
